<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#082f4d">
  <title>SYTC Agenda Builder</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
  <style>
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#edf2f5;color:#172630;font-family:Arial,"Noto Sans TC",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
    .app{min-height:100vh;display:grid;grid-template-columns:292px minmax(0,1fr)}
    .sidebar{position:sticky;top:0;height:100vh;overflow:auto;padding:24px 22px;background:#082f4d;color:#fff}.brand{display:flex;align-items:center;gap:11px;margin-bottom:24px}.logo{display:grid;place-items:center;width:46px;height:46px;border:2px solid #70c8ee;border-radius:50%;font-weight:900}.brand b{letter-spacing:.04em}.sidebar h1{margin:8px 0;font-size:25px;line-height:1.2}.intro{margin:0 0 18px;color:#bed0dc;font-size:13px;line-height:1.55}.side-section{margin:16px 0;padding-top:15px;border-top:1px solid #ffffff24}.side-label{display:block;margin:0 0 7px;color:#b8ccd8;font-size:11px;font-weight:bold;letter-spacing:.04em}.sidebar select{width:100%;padding:10px;border:1px solid #59788b;border-radius:8px;background:#103f5e;color:#fff}.file{margin:9px 0;padding:10px;border-radius:7px;background:#ffffff10;color:#bdd0db;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.btn{border:1px solid #c3d0d7;border-radius:8px;background:#fff;color:#17354a;font-weight:bold}.btn:hover{filter:brightness(.97)}.btn:disabled{cursor:not-allowed;opacity:.45}.btn-primary{border:0;background:#f4b942;color:#17202a}.btn-danger{border-color:#e39a9a;color:#a32323}.sidebar .btn{width:100%;padding:11px;margin-top:7px}.button-row{display:grid;grid-template-columns:1fr 1fr;gap:7px}.button-row .btn{margin:0}.nav-row{display:grid;grid-template-columns:42px 1fr 42px;gap:6px}.nav-row button{padding:8px}.privacy{margin:14px 0 0;color:#89a3b3;font-size:10px;line-height:1.5;text-align:center}
    .main{min-width:0}.topbar{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 18px;background:#ffffffed;border-bottom:1px solid #d5dfe4;backdrop-filter:blur(9px)}.tabs,.top-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.topbar .btn{padding:8px 11px}.tab.active{background:#0b527a;color:#fff;border-color:#0b527a}.save-state{padding:7px 10px;border-radius:999px;background:#e0f3e8;color:#176a3d;font-size:11px;font-weight:bold}.save-state.warn{background:#fff2cd;color:#7b5a00}
    .editor{padding:18px clamp(12px,3vw,34px) 8px}.editor-inner{max-width:1180px;margin:auto}.editor-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:12px}.editor-head h2{margin:0;font-size:21px}.editor-head p{margin:4px 0 0;color:#647988;font-size:12px}.editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{padding:15px;border:1px solid #ced9df;border-radius:12px;background:#fff;box-shadow:0 7px 20px #19374a0a}.card.full{grid-column:1/-1}.card h3{display:flex;justify-content:space-between;align-items:center;margin:0 0 11px;font-size:15px}.card h3 small{color:#718590;font-weight:400}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.field{display:flex;flex-direction:column;gap:5px}.field.wide{grid-column:1/-1}.field label{color:#5e7380;font-size:11px;font-weight:bold}.field input,.field select,.field textarea{width:100%;padding:8px 9px;border:1px solid #bccbd3;border-radius:7px;background:#fff;color:#132b39}.field textarea{min-height:58px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid #8ac7e7;border-color:#2781b4}

    .speaker-list{display:grid;gap:10px}.speaker-card{position:relative;padding:12px;border:1px solid #c8d7de;border-radius:10px;background:#fbfdfe}.speaker-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.speaker-head b{color:#0b527a}.speaker-head .btn{padding:6px 9px;font-size:11px}.speaker-fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.speaker-fields .field:nth-child(2){grid-column:span 2}.speaker-fields .person-drop{min-height:70px}.speaker-fields .span2{grid-column:span 2}.add-speaker{margin-top:10px;padding:10px 14px}

    .preview{padding:18px 12px 60px;overflow:auto}.preview-head{max-width:1030px;margin:0 auto 11px;display:flex;justify-content:space-between;align-items:end}.preview-head small{color:#5c7789;font-weight:bold;letter-spacing:.12em}.preview-head h2{margin:3px 0 0}.ready{padding:7px 10px;border-radius:999px;background:#dff5e9;color:#187344;font-size:11px;font-weight:bold}.agenda-stage{display:flex;align-items:flex-start;justify-content:center;gap:14px;min-width:1016px}.sheet{flex:0 0 760px;margin:0;background:#fff;border:1px solid #111;color:#000;box-shadow:0 18px 45px #1e374620}.club{position:relative;height:95px;overflow:hidden;background:#064466;color:#fff}.club-logo{position:absolute;inset:0 auto 0 0;width:110px;height:95px;overflow:hidden}.club-logo img{width:760px;height:95px;max-width:none}.club-title{position:absolute;inset:7px 8px 0 108px;text-align:center;font-weight:900}.club-title h3{margin:0;font-size:30px;line-height:1.1;letter-spacing:1px;white-space:nowrap}.club-title p{margin:6px 0 0;font-size:16px;white-space:nowrap}.strip{display:grid;grid-template-columns:55% 45%;height:26px;border-top:1px solid #111;border-bottom:1px solid #111;font:14px/24px "Times New Roman",serif;white-space:nowrap;overflow:hidden}.strip span{padding:0 7px}.strip span+span{border-left:1px solid #111}.motto{height:29px;font:bold 17px/27px Arial,sans-serif}.motto strong{display:block;text-align:center;background:#050505;color:#fff}.agenda-body{display:grid;grid-template-columns:140px 1fr}.mission{border-right:2px solid #111;font-family:"Times New Roman",serif}.mission h4{margin:0;padding:5px 8px;border-bottom:1px solid #111;font-size:16px;font-weight:400;text-decoration:underline}.mission p{margin:0;padding:8px 7px;font-size:14px;line-height:1.35}.agenda-grid{min-width:0}.meta{display:grid;grid-template-columns:1fr 1fr 1.6fr;height:31px;border-bottom:2px solid #111;font-size:14px}.meta div{padding:0 8px;border-right:1px solid #111;text-align:center;line-height:29px;font-weight:bold}.meta div:last-child{border:0}.meta span{margin-left:5px;color:#00e}.agenda-row{display:grid;grid-template-columns:38px 1fr 125px 125px;min-height:31px;border-bottom:1px solid #111;font:14px/1.05 "Times New Roman",serif}.agenda-row>span{display:flex;align-items:center;padding:3px 6px;border-right:1px solid #111}.agenda-row>span:last-child{border:0}.agenda-time{justify-content:center;font-weight:bold}.agenda-role{justify-content:center}.agenda-name{color:#00e}.section-row,.merge-row{display:grid;grid-template-columns:38px 1fr;min-height:31px;border-bottom:1px solid #111;font:bold 14px/30px "Times New Roman",serif}.section-row span,.merge-row span{padding:0 6px;border-right:1px solid #111}.section-row span:last-child,.merge-row span:last-child{border:0}.speech{display:grid;grid-template-columns:38px 28px 1fr 58px;min-height:48px;border-bottom:1px solid #111;font:14px "Times New Roman",serif}.speech>div{border-right:1px solid #111}.speech>div:last-child{border:0}.speech-time,.speech-num{display:grid;place-items:center}.speech-main{padding:4px 7px}.speech-detail{display:flex;gap:8px;align-items:baseline}.speech-detail b{color:#00e}.speech-detail i{font-weight:bold}.speech-meta{margin-top:3px;font-size:12px}.speech-duration{display:grid;place-items:center;margin:10px 7px;background:#777;color:#fff;font-size:12px}.future{margin-top:9px;border:1px solid #111;font:13px "Times New Roman",serif}.future h4{margin:0;padding:3px 7px;background:#fff19a;border-bottom:1px solid #111}.future div{min-height:24px;padding:4px 7px;border-bottom:1px solid #111}.future div:last-child{border:0}.next-roles{width:475px;margin:10px 0 0 auto;border-collapse:collapse;font:12px "Times New Roman",serif}.next-roles th,.next-roles td{height:24px;padding:3px 7px;border:1px solid #111}.next-roles th{background:#f6dfcc}.next-roles td:nth-child(2),.next-roles td:nth-child(4){color:#00e;text-align:center}.placeholder{padding:18px;text-align:center;color:#667984}
    .time-panel{position:relative;flex:0 0 242px;background:#fff;border:1px solid #b42045;box-shadow:0 10px 25px #1e374618;font-family:Arial,sans-serif}.time-panel summary{cursor:pointer;padding:9px 10px;border-bottom:1px solid #b42045;font-weight:bold}.time-panel summary small{float:right;color:#ff7100;font-size:15px}.time-panel details{position:relative;width:100%;height:100%}.start-anchor{position:absolute;left:0;right:0;top:42px;display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:#061cff;color:#fff;font-size:12px}.start-anchor strong{font-size:16px}.time-help{position:absolute;left:0;right:0;top:76px;padding:7px 9px;background:#fff7e7;color:#74521a;font-size:11px}.time-control{position:absolute;left:0;right:0;display:grid;grid-template-columns:1fr 52px;align-items:center;min-height:31px;border-top:1px solid #ddd;border-bottom:1px solid #ddd;background:#fff;font-size:12px}.time-control b{padding:4px 7px;font-weight:400}.time-control input{width:47px;min-height:28px;padding:3px 2px;border:0;border-bottom:1px solid #d86b7d;color:#d80000;font-weight:bold;text-align:center}.time-control input:focus{outline:2px solid #ffb4bf}.time-warnings{position:absolute;left:0;right:0;bottom:0;background:#fff1f1;color:#c40000;font-size:11px;font-weight:bold}.time-warnings div{padding:6px 8px;border-top:1px solid #efb5b5}

    .meeting-number-input{width:100%;min-width:0;padding:10px;border:1px solid #59788b;border-radius:8px;background:#103f5e;color:#fff;text-align:center;font-weight:bold}.meeting-number-input:focus{outline:2px solid #70c8ee}.nav-row button{margin:0}.meeting-go{margin-top:7px!important}.next-roles th small{display:block;margin-top:2px;font-weight:400}.next-empty{width:475px;margin:10px 0 0 auto;padding:11px;border:1px solid #111;background:#fffaf2;font:13px "Times New Roman",serif;text-align:center}.readonly-number{background:#eef3f6!important;color:#49616e!important;font-weight:bold;cursor:not-allowed}
    .template-picker{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}.template-picker .btn{padding:8px 12px}.template-picker .active{background:#0b527a;color:#fff;border-color:#0b527a}.advanced-box{margin-top:10px;border:1px solid #d4dfe4;border-radius:9px;background:#f9fbfc}.advanced-box summary{padding:10px 12px;cursor:pointer;color:#35586b;font-size:12px;font-weight:bold}.advanced-box>div{padding:0 12px 12px}.header-fields,.session-edit-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.logo-tools,.add-session-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.logo-tools input{max-width:260px}.add-session-bar{justify-content:space-between;margin-bottom:10px}.session-builder{display:grid;gap:8px}.session-builder-card{padding:10px;border:1px solid #c8d7de;border-radius:10px;background:#fbfdfe}.session-builder-head{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:8px}.session-builder-head .drag-handle{cursor:grab;color:#6f8793;font-size:20px}.session-builder-head h4{margin:0;font-size:13px}.session-builder-head small{display:block;color:#6b808b;font-weight:400}.session-edit-grid{margin-top:9px}.visibility-toggle,.check-line{display:flex;align-items:center;gap:6px;color:#46616f;font-size:11px}.source-note{padding:7px 9px;border-radius:7px;background:#eef5f8;color:#526c79;font-size:11px}.evaluator-hidden{padding:8px;border:1px dashed #d9b56a;border-radius:7px;background:#fff9e9;color:#72571b;font-size:11px}.subrow-list{display:grid;gap:6px;margin-top:8px}.subrow{display:grid;grid-template-columns:1.5fr 1fr 1fr auto;gap:6px;align-items:end}.btn.compact{width:auto!important;margin:0!important;padding:7px 9px!important;font-size:11px}.keynote-heading{background:#fff2bf}.keynote-speech{background:#fffaf0}.club-logo.uploaded img{width:100%;height:100%;object-fit:contain;background:#064466}.toast.show{display:block}.toast:not(.show){display:none}
    @media(max-width:1050px){.editor-grid{grid-template-columns:1fr}.card.full{grid-column:auto}.role-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.speaker-fields{grid-template-columns:repeat(2,minmax(0,1fr))}.speaker-fields .field:nth-child(2){grid-column:auto}}
    @media(max-width:780px){.app{display:block}.sidebar{position:relative;height:auto;padding:16px}.sidebar h1,.intro{display:none}.brand{margin-bottom:10px}.main{overflow:hidden}.topbar{top:0;padding:8px}.editor{padding:12px 9px}.fields,.role-grid,.future-grid,.header-fields,.session-edit-grid{grid-template-columns:1fr}.speaker-fields{grid-template-columns:1fr}.speaker-fields .span2{grid-column:auto}.preview{padding:12px 8px 50px;-webkit-overflow-scrolling:touch}.agenda-stage{flex-direction:column;justify-content:flex-start;min-width:760px}.time-panel{order:-1;position:relative;width:min(100vw - 16px,760px);height:auto!important;min-height:90px;flex-basis:auto}.time-panel details{height:auto}.time-panel .start-anchor,.time-panel .time-help,.time-panel .time-control,.time-panel .time-warnings{position:static}.time-panel .time-control{height:auto!important;min-height:42px}.time-panel input{min-height:38px;font-size:16px}.subrow{grid-template-columns:1fr}.topbar .btn{padding:7px 8px;font-size:11px}.editor-head{align-items:flex-start;flex-direction:column}}
    .dialog #confirmText{white-space:pre-wrap;max-height:55vh;overflow:auto;line-height:1.5}
    .margin-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.margin-field{display:grid;gap:4px}.margin-field span{color:#b8ccd8;font-size:10px;font-weight:bold}.margin-field input{width:100%;min-width:0;padding:9px 6px;border:1px solid #59788b;border-radius:8px;background:#103f5e;color:#fff;text-align:center;font-weight:bold}.margin-field input:focus{outline:2px solid #70c8ee}.margin-note{margin:9px 0 0;padding:9px 10px;border-radius:8px;background:#ffffff10;color:#bed0dc;font-size:10px;line-height:1.65}.margin-note b{color:#fff}.margin-note .warn{color:#ffcf6b}
    /* A4 210x297mm 減去上下左右 --print-margin；@page 的 margin 必須與 --print-margin 一致 */
    :root{--print-margin:12mm;--print-page-w:186mm;--print-page-h:273mm}
    @media print{@page{size:A4 portrait;margin:12mm}html,body{width:var(--print-page-w);height:var(--print-page-h);overflow:hidden!important;background:#fff}.sidebar,.topbar,.editor,.preview-head,.time-panel,.toast,.dialog{display:none!important}.app{display:block}.main{overflow:visible}.preview{display:block!important;width:var(--print-page-w);height:var(--print-page-h);padding:0;overflow:hidden!important}.agenda-stage{display:flex;align-items:flex-start;justify-content:center;width:var(--print-page-w);min-width:0;height:var(--print-page-h);overflow:hidden}.sheet{flex:0 0 auto;width:760px!important;margin:0!important;border:1px solid #111;box-shadow:none;zoom:var(--print-scale,1);transform-origin:top left;break-inside:avoid;page-break-inside:avoid}.future,.next-roles,.agenda-row,.speech{break-inside:avoid;page-break-inside:avoid}.club{print-color-adjust:exact;-webkit-print-color-adjust:exact}.agenda-row{grid-template-columns:38px 1fr 125px 125px}}

  <style>@media(max-width:780px){.time-panel{width:calc(100vw - 16px)}}</style>
</head>
<body>
<main class="app">
  <aside class="sidebar">
    <div class="brand"><span class="logo">SY</span><b>SYTC Agenda Builder</b></div>
    <h1>工作安排與<br>Agenda 編排器</h1>
    <p class="intro">上傳 Excel 後即可選人、增減 Speaker、拖曳流程並調整時間。</p>
    <input id="excelFile" type="file" accept=".xlsx,.xls,.xlsm" hidden>
    <button class="btn btn-primary" id="importTrigger">↑　選擇／更換 Excel</button>
    <button class="btn hidden" id="resumeBtn">繼續上次編排</button>
    <div class="file" id="fileName">示範資料</div>
    <div class="side-section">
      <span class="side-label">選擇會議場次</span>
      <div class="nav-row"><button class="btn" id="prevMeeting" aria-label="上一場">‹</button><input class="meeting-number-input" id="meetingNumberInput" type="number" min="1" step="1" inputmode="numeric" list="meetingNumberList" aria-label="輸入 Meeting Number"><button class="btn" id="nextMeeting" aria-label="下一場">›</button></div>
      <datalist id="meetingNumberList"></datalist>
      <button class="btn meeting-go" id="goMeeting">前往／建立場次</button>
      <div class="button-row" style="margin-top:7px"><button class="btn" id="addMeeting">＋新增</button><button class="btn" id="duplicateMeeting">複製</button></div>
      <button class="btn btn-danger" id="deleteMeeting">刪除目前場次</button>
    </div>
    <div class="side-section">
      <span class="side-label">PDF 頁面邊界</span>
      <div class="margin-grid">
        <label class="margin-field"><span>左右留白 (mm)</span><input id="marginX" type="number" min="0" max="40" step="0.5" inputmode="decimal"></label>
        <label class="margin-field"><span>上下留白 (mm)</span><input id="marginY" type="number" min="0" max="40" step="0.5" inputmode="decimal"></label>
      </div>
      <p class="margin-note" id="marginNote"></p>
      <button class="btn" id="resetMargin">回復預設邊界</button>
    </div>
    <div class="side-section">
      <button class="btn" id="exportBtn">↓　下載更新後原始 Excel</button>
      <button class="btn" id="printBtn">列印／另存 PDF</button>
      <button class="btn btn-danger" id="resetMeeting">重設目前場次</button>
    </div>
    <p class="privacy">資料只儲存在目前瀏覽器，不會上傳到伺服器。</p>
  </aside>
  <section class="main">
    <header class="topbar">
      <nav class="tabs"><button class="btn tab active" data-target="editor">工作安排</button><button class="btn tab" data-target="preview">Agenda 預覽</button></nav>
      <div class="top-actions"><button class="btn" id="undoBtn">↶ 復原</button><button class="btn" id="redoBtn">↷ 重做</button><span class="save-state" id="saveState">已自動保存</span></div>
    </header>
    <section class="editor" id="editor"><div class="editor-inner" id="editorContent"></div></section>
    <section class="preview" id="preview">
      <div class="preview-head"><div><small>AGENDA PREVIEW</small><h2 id="previewTitle">Meeting</h2></div><span class="ready" id="previewStatus">● 即時預覽</span></div>
      <div class="agenda-stage"><article class="sheet" id="sheet"></article><aside class="time-panel" id="timePanel"></aside></div>
    </section>
  </section>
</main>
