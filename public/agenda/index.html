<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SYTC Agenda Builder</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#edf2f5;color:#15202b;font-family:Arial,sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:310px 1fr}.panel{height:100vh;position:sticky;top:0;padding:30px 26px;background:#082f4d;color:#fff}.brand{display:flex;align-items:center;gap:12px;margin-bottom:44px}.logo{display:grid;place-items:center;width:52px;height:52px;border:2px solid #6cc5ed;border-radius:50%;font-weight:900}.brand b{letter-spacing:.05em}.badge{display:inline-block;padding:7px 10px;border:1px solid #ffffff40;border-radius:99px;color:#9bd9ff;font-size:12px;font-weight:bold}.panel h1{margin:16px 0 12px;font-size:29px;line-height:1.2}.intro{color:#bed0dc;font-size:14px;line-height:1.6}.upload,.print{width:100%;padding:14px;border-radius:9px;font-weight:bold;cursor:pointer}.upload{margin-top:12px;border:0;background:#f4b942;color:#17202a}.print{border:1px solid #91aebb;background:transparent;color:#fff}.file{margin:17px 0 25px;padding:12px;background:#ffffff12;border-radius:8px;font-size:12px;color:#bcd0da;overflow:hidden;text-overflow:ellipsis}.panel label{display:block;margin-bottom:7px;color:#b8ccd8;font-size:12px;font-weight:bold}.panel select{width:100%;padding:12px;border:1px solid #5a788b;border-radius:8px;background:#103f5e;color:#fff}.count{margin:18px 0;padding:14px;border:1px solid #ffffff20;border-radius:8px;color:#a9bfcb}.count strong{float:right;color:#f4b942;font-size:27px}.error{margin:14px 0;padding:11px;border:1px solid #ff9b95;border-radius:8px;background:#692d33;color:#ffe5e2;font-size:13px}.privacy{margin-top:14px;color:#89a3b3;font-size:11px;line-height:1.5;text-align:center}.preview{padding:26px 4vw 60px;overflow:auto}.toolbar{max-width:980px;margin:0 auto 14px;display:flex;justify-content:space-between;align-items:end}.toolbar small{color:#5c7789;font-weight:bold;letter-spacing:.12em}.toolbar h2{margin:4px 0 0}.ready{padding:8px 11px;border-radius:99px;background:#dff5e9;color:#187344;font-size:12px;font-weight:bold}.sheet{width:min(980px,100%);margin:auto;background:#fff;border:1px solid #b8c4cc;box-shadow:0 18px 45px #1e374620}.club{display:flex;align-items:center;gap:16px;padding:14px 22px;background:linear-gradient(135deg,#063558,#0b557f);color:#fff}.club .seal{display:grid;place-items:center;width:62px;height:62px;border:3px double #f3c566;border-radius:50%;font-weight:900}.club h3{margin:0;font-size:clamp(24px,3.2vw,40px)}.club p{margin:7px 0 0;font-weight:bold}.strip{display:flex;justify-content:space-between;padding:5px 11px;border-bottom:1px solid #111;font-size:12px}.motto{font-size:14px;font-weight:bold}.motto strong{padding:2px 8px;background:#111;color:#fff}.meta{display:grid;grid-template-columns:1fr .8fr 1.5fr;border-bottom:2px solid #111}.meta div{padding:8px 11px;border-right:1px solid #111;font-weight:bold}.meta div:last-child{border:0}.meta span{color:#0a43db;margin-left:9px}.row{display:grid;grid-template-columns:30px 1fr 170px 190px;min-height:33px;border-bottom:1px solid #111;font-family:'Times New Roman',serif}.row>span{display:flex;align-items:center;padding:6px 8px;border-right:1px solid #111}.row>span:last-child{border:0}.diamond{justify-content:center;color:#31546a;font-size:9px}.role{justify-content:center}.name{color:#0a43db;font-family:Arial,sans-serif;font-weight:bold}.missing{color:#a85024;font-style:italic}.section{padding:7px 11px;border-bottom:1px solid #111;background:#f2f5f7;font-family:'Times New Roman',serif;font-size:16px;font-weight:bold}.speech{display:grid;grid-template-columns:46px 1fr 205px;min-height:62px;border-bottom:1px solid #111}.speech>div{padding:8px 11px;border-right:1px solid #111}.speech>div:last-child{border:0}.num{display:grid;place-items:center}.speech-main{display:flex;flex-direction:column;justify-content:center;gap:3px}.speech-main b,.eval b{color:#0a43db}.speech-main small{color:#64717a}.eval{display:flex;flex-direction:column;justify-content:center;gap:5px}.eval small{color:#74808a;text-transform:uppercase}.placeholder{padding:20px;text-align:center;color:#657784}
    @media(max-width:780px){.app{display:block}.panel{position:relative;height:auto}.preview{padding:18px 10px;overflow-x:auto}.sheet{min-width:720px}}
    @media print{@page{size:A4 portrait;margin:8mm}.panel,.toolbar{display:none}.app{display:block}.preview{padding:0}.sheet{width:100%;border:0;box-shadow:none}.club{print-color-adjust:exact;-webkit-print-color-adjust:exact}.row{grid-template-columns:28px 1fr 145px 165px}}
    /* Excel 原版 Agenda 版面 */
    .toolbar{max-width:900px}.sheet{width:min(900px,100%);border:1px solid #111;color:#000}
    .club{position:relative;height:95px;padding:0;display:block;overflow:hidden;background:#064466}
    .club-logo{position:absolute;inset:0 auto 0 0;width:130px;height:95px;overflow:hidden}
    .club-logo img{width:900px;height:95px;max-width:none}
    .club-title{position:absolute;inset:7px 8px 0 128px;text-align:center;font-family:Arial,sans-serif;font-weight:900}
    .club-title h3{margin:0;font-size:35px;line-height:1.1;letter-spacing:1px;white-space:nowrap}
    .club-title p{margin:6px 0 0;font-size:18px;white-space:nowrap}
    .strip{display:grid;grid-template-columns:55% 45%;height:26px;padding:0;border-top:1px solid #111;border-bottom:1px solid #111;font:14px/24px 'Times New Roman',serif;white-space:nowrap;overflow:hidden}
    .strip span{padding:0 7px}.strip span+span{border-left:1px solid #111}
    .motto{height:29px;font:bold 17px/27px Arial,sans-serif}.motto strong{display:block;padding:0;text-align:center;background:#050505;color:#fff}
    .agenda-body{display:grid;grid-template-columns:164px 1fr}.mission{border-right:2px solid #111;font-family:'Times New Roman',serif}
    .mission h4{margin:0;padding:5px 8px;border-bottom:1px solid #111;font-size:16px;font-weight:400;text-decoration:underline}
    .mission p{margin:0;padding:8px 7px;font-size:15px;line-height:1.35}.agenda-grid{min-width:0}
    .meta{grid-template-columns:1fr 1fr 1.6fr;height:31px}.meta div{padding:0 8px;text-align:center;line-height:29px}.meta span{color:#00e;margin-left:5px}
    .row{grid-template-columns:45px 1fr 148px 150px;min-height:31px;font:16px/1.05 'Times New Roman',serif}.row>span{padding:3px 6px}
    .time{justify-content:center;font-weight:bold}.name{color:#00e;font-family:'Times New Roman',serif;font-weight:400}.missing{color:#666}
    .section-row,.merge-row{display:grid;grid-template-columns:45px 1fr;min-height:31px;border-bottom:1px solid #111;font:bold 16px/30px 'Times New Roman',serif}
    .section-row span,.merge-row span{padding:0 6px;border-right:1px solid #111}.section-row span:last-child,.merge-row span:last-child{border:0}
    .speech{grid-template-columns:45px 31px 1fr;min-height:63px;font:16px 'Times New Roman',serif}.speech>div{padding:0}.speech-time,.num{display:grid;place-items:center}
    .speech-main{display:block;padding:4px 7px}.speaker-line{height:23px;color:#00e}.speech-bar{height:29px;margin-top:2px;background:linear-gradient(to right,#fff 0 17%,#777 17% 83%,#fff 83%);font-size:13px;line-height:25px}
    .speech-title{position:relative;z-index:1;display:inline-block;max-width:82%;padding-right:5px;background:#fff}
    @media(max-width:780px){.sheet{min-width:900px}}
    .toolbar{max-width:760px}.sheet{width:760px}.club-logo{width:110px}.club-logo img{width:760px}.club-title{left:108px}.club-title h3{font-size:30px}.club-title p{font-size:16px}
    .agenda-body{grid-template-columns:140px 1fr}.row{grid-template-columns:38px 1fr 125px 125px;font-size:14px}.speech{grid-template-columns:38px 28px 1fr;font-size:14px}
    .section-row,.merge-row{grid-template-columns:38px 1fr;font-size:14px}.meta{font-size:14px}.mission p{font-size:14px}
    @media(max-width:780px){.sheet{min-width:760px}}
    .speech{grid-template-columns:38px 28px 1fr 58px;min-height:48px}.speech-main{padding:4px 7px}.speech-detail{display:flex;gap:8px;align-items:baseline}.speech-detail b{color:#00e}.speech-detail i{font-weight:bold}.speech-meta{margin-top:3px;font-size:12px}.speech-duration{display:grid;place-items:center;margin:10px 7px;background:#777;color:#fff;font-size:12px}
    .future{margin-top:9px;border:1px solid #111;font:13px 'Times New Roman',serif}.future h4{margin:0;padding:3px 7px;background:#fff19a;border-bottom:1px solid #111}.future div{height:24px;padding:4px 7px;border-bottom:1px solid #111}.future div:last-child{border:0}
    .next-roles{width:475px;margin:10px 0 0 auto;border-collapse:collapse;font:12px 'Times New Roman',serif}.next-roles th,.next-roles td{height:24px;padding:3px 7px;border:1px solid #111}.next-roles th{background:#f6dfcc}.next-roles td:nth-child(2),.next-roles td:nth-child(4){color:#00e;text-align:center}
    .person-picker{width:100%;min-width:0;padding:2px 18px 2px 3px;border:1px solid transparent;border-radius:2px;background:transparent;color:#00e;font:inherit}.person-picker:hover,.person-picker:focus{border-color:#71a5d5;background:#eef7ff;outline:0}.speech-detail .person-picker{width:105px;font-weight:bold}.next-roles .person-picker{text-align:center}
    @media print{.person-picker{appearance:none;border:0;padding:0;background:transparent}}
    .toolbar{max-width:1030px}.agenda-stage{display:flex;align-items:flex-start;justify-content:center;gap:14px}.agenda-stage .sheet{flex:0 0 760px;margin:0}.time-panel{position:sticky;top:18px;flex:0 0 242px;background:#fff;border:1px solid #b42045;box-shadow:0 10px 25px #1e374618;font-family:Arial,sans-serif}.time-panel details{width:100%}.time-panel summary{cursor:pointer;padding:9px 10px;border-bottom:1px solid #b42045;background:#fff;font-weight:bold}.time-panel summary small{float:right;color:#ff7100;font-size:15px}.time-help{padding:7px 9px;background:#fff7e7;color:#74521a;font-size:11px}.time-control{display:grid;grid-template-columns:60px 1fr 48px;align-items:center;min-height:31px;margin:0;border-top:1px solid #ddd;font-size:12px}.time-control>span{padding:3px;color:#fff;background:#061cff;font-weight:bold;text-align:center}.time-control>span:empty{background:#fff}.time-control b{padding:4px 7px;font-weight:400}.time-control input{width:42px;padding:3px 2px;border:0;border-bottom:1px solid #d86b7d;background:#fff;color:#e00000;font-weight:bold;text-align:center}.time-control input:focus{outline:2px solid #ffb4bf}.time-warnings{color:#c40000;background:#fff1f1;font-size:11px;font-weight:bold}.time-warnings div{padding:6px 8px;border-top:1px solid #efb5b5}
    @media(max-width:1100px){.agenda-stage{justify-content:flex-start}.time-panel{position:static}}
    @media(max-width:900px){.agenda-stage{flex-direction:column}.time-panel{order:-1;width:760px;flex-basis:auto}.time-panel details:not([open]) summary{border-bottom:0}}
    .time-control{grid-template-columns:1fr 48px}.time-control>span{display:none}.start-anchor{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:#061cff;color:#fff;font-size:12px}.start-anchor strong{font-size:16px}
    .time-panel{position:relative;top:auto}.time-panel.session-aligned details{position:relative;height:100%}.time-panel.session-aligned .time-control{position:absolute;left:0;right:0;margin:0;background:#fff;border:1px solid #ddd;border-left:0;border-right:0}.time-panel.session-aligned .time-warnings{position:absolute;left:0;right:0;bottom:0}.time-panel.session-aligned .start-anchor{position:absolute;left:0;right:0;top:42px}.time-panel.session-aligned .time-help{position:absolute;left:0;right:0;top:76px}
    @media(max-width:900px){.time-panel{height:auto!important}.time-panel .time-control{position:static}.time-panel .start-anchor,.time-panel .time-help,.time-panel .time-warnings{position:static}}
    @media print{.time-panel{display:none}.agenda-stage{display:block}.agenda-stage .sheet{margin:auto}}
  </style>
</head>
<body>
<main class="app">
  <aside class="panel">
    <div class="brand"><span class="logo">SY</span><b>SYTC Agenda Builder</b></div>
    <span class="badge">最簡單版本</span><h1>從 Excel 產生<br>正式 Agenda</h1>
    <p class="intro">不需要公式。選擇原始 Excel，再挑選場次即可預覽。</p>
    <input id="fileInput" type="file" accept=".xlsx,.xls,.xlsm" hidden>
    <button class="upload" id="upload">↑　選擇 Excel 檔案</button>
    <div class="file" id="fileName">尚未選擇檔案</div>
    <div id="error"></div>
    <label for="meeting">選擇會議場次</label><select id="meeting" disabled><option>請先選擇 Excel</option></select>
    <div class="count">已讀取會議場次 <strong id="count">0</strong></div>
    <button class="print" onclick="window.print()">列印／另存 PDF</button>
    <p class="privacy">Excel 只在你的瀏覽器中讀取，不會上傳到伺服器。</p>
  </aside>
  <section class="preview">
    <div class="toolbar"><div><small>AGENDA PREVIEW</small><h2 id="previewTitle">等待 Excel</h2></div><span class="ready" id="status">○ 尚未載入</span></div>
    <div class="agenda-stage">
      <article class="sheet" id="sheet"><div class="placeholder">請點左側「選擇 Excel 檔案」開始</div></article>
      <aside class="time-panel" id="timePanel"></aside>
    </div>
  </section>
</main>
<script>
const $=s=>document.querySelector(s), clean=v=>v==null?'':String(v).trim(); let meetings=[{number:452,date:'2026/09/01',theme:'',word:'',values:{receptionist:'Chin Chi Lai',tme:'Mark Weng',timer:'Alex Ho','ah counter':'Mandy Lin','variety master':'Darren Lin',topicsmaster:'Darren Lin',ge:'Camila Wu',grammarian:'Steve Huang','#1 speaker':'Gina Wu','#1 evaluator':'Watchman Chen','#2 speaker':'Chin Chi Lai','#2 evaluator':'TBA','#3 speaker':'Sue Huang'}}];
function dateText(v){if(!v)return'';if(v instanceof Date)return`${v.getFullYear()}/${v.getMonth()+1}/${v.getDate()}`;if(typeof v==='number'){const d=XLSX.SSF.parse_date_code(v);return d?`${d.y}/${d.m}/${d.d}`:String(v)}return clean(v)}
function parse(buffer){const wb=XLSX.read(buffer,{type:'array',cellDates:true});const n=wb.SheetNames.find(x=>x.toLowerCase().includes('assignment for agenda'));if(!n)throw Error('找不到「Assignment for Agenda」工作表，請上傳原始 SYTC Excel。');const rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:''}),labels=new Map();rows.forEach((r,i)=>{const l=clean(r[1]);if(l)labels.set(l.toLowerCase(),i)});const mr=labels.get('meeting number'),dr=labels.get('date');if(mr==null||dr==null)throw Error('找不到 Meeting number 或 Date，檔案格式可能已被修改。');const out=[];for(let c=2;c<(rows[mr]||[]).length;c++){const num=rows[mr][c];if(typeof num!=='number')continue;const values={};labels.forEach((r,l)=>values[l]=clean(rows[r][c]));out.push({number:Math.trunc(num),date:dateText(rows[dr][c]),theme:values['meeting theme']||'',word:values['word of the day']||'',values})}if(!out.length)throw Error('檔案中沒有可用的 Meeting 資料。');return out}
function row(label,role,name,strong=false){return`<div class="row"><span class="diamond">${strong?'◆':''}</span><span><b>${label}</b></span><span class="role">${role||''}</span><span class="name ${name?'':'missing'}">${name||'待安排'}</span></div>`}
function render(m){const v=l=>m.values[l.toLowerCase()]||'',speeches=[1,2,3,4,5].map(i=>({i,s:v(`#${i} Speaker`),t:v(`#${i} Title`),l:v(`#${i} Level`)||v(`#${i} No.`),p:v(`#${i} Project`),d:v(`#${i} Time`),e:v(`#${i} Evaluator`)})).filter(x=>x.s||x.t||x.e);$('#previewTitle').textContent=`Meeting ${m.number}`;$('#status').textContent='● 預覽完成';$('#sheet').innerHTML=`<header class="club"><div class="seal">SY</div><div><h3>SHIN YING TOASTMASTERS CLUB</h3><p>Since 2006　|　Club No. 974403　|　Area 4　|　Division H</p></div></header><div class="strip"><span>Regular Meeting: 7–9pm, 1st & 3rd Tuesday</span><span>Venue: 新營天居五樓會議室</span></div><div class="strip motto"><span>Zoom ID: 8911 1386 086　Password: 907992</span><strong>Learn Together; Empower Each Other.</strong></div><div class="meta"><div>Date <span>${m.date||'—'}</span></div><div>Meeting No. <span>${m.number}</span></div><div>Theme <span>${m.theme||'—'}</span></div></div>${row('Equipment checkout & Social time','Receptionist',v('Receptionist'))}${row('SAA calls for opening','SAA',v('SAA')||v('GE'))}${row('Chair calls meeting to order','President',v('President')||v('Receptionist'))}${row('Toastmaster calls on meeting roles','Toastmaster',v('TME'),true)}${row('Timer','Timer',v('Timer'))}${row('Ah Counter','Ah counter',v('Ah Counter'))}${row(m.word?'Word of the day · '+m.word:'Word of the day','Grammarian',v('Grammarian'),true)}${row('Variety session','Variety Master',v('Variety Master'),true)}<div class="section">◆ Manual speech session</div>${speeches.length?speeches.map(x=>`<div class="speech"><div class="num">${x.i}</div><div class="speech-main"><b>${x.s||'待安排講者'}</b><span>${x.t||'題目尚未填寫'}</span><small>${[x.l,x.p,x.d].filter(Boolean).join(' · ')}</small></div><div class="eval"><small>Evaluator</small><b class="${x.e?'':'missing'}">${x.e||'待安排'}</b></div></div>`).join(''):'<div class="placeholder">尚未安排演講</div>'}${row('Officers’ report / Introducing guests','President',v('President')||v('Receptionist'),true)}${row('Table Topics Session','Topicsmaster',v('Topicsmaster'),true)}${row('Evaluation session','General Evaluator',v('GE'),true)}${speeches.map(x=>row(`${x.i}. ${x.s||'Speaker'}`,'Evaluator',x.e)).join('')}${row('Timer and Ah Counter’s reports','Reports',[v('Timer'),v('Ah Counter')].filter(Boolean).join(', '),true)}${row('Grammarian’s report','Grammarian',v('Grammarian'),true)}${row('General Evaluator’s comment','General Evaluator',v('GE'),true)}${row('Toastmaster wraps up','Toastmaster',v('TME'),true)}`}
$('#upload').onclick=()=>$('#fileInput').click();$('#fileInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('#error').innerHTML='';try{meetings=parse(await f.arrayBuffer());$('#fileName').textContent=f.name;$('#count').textContent=meetings.length;$('#meeting').disabled=false;$('#meeting').innerHTML=meetings.map((m,i)=>`<option value="${i}">Meeting ${m.number} · ${m.date}</option>`).join('');render(meetings[0])}catch(err){$('#error').innerHTML=`<div class="error">${err.message}</div>`}e.target.value=''};$('#meeting').onchange=e=>render(meetings[Number(e.target.value)]);$('#fileName').textContent='示範資料（請選擇 Excel）';$('#count').textContent='1';$('#meeting').disabled=false;$('#meeting').innerHTML='<option>Meeting 452 · 2026/09/01</option>';render(meetings[0]);
</script>
<script src="agenda-layout.js"></script>
<script>render(meetings[0])</script>
</body></html>
